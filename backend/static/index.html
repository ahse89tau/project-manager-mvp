<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PM MVP Backend Scaffold</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
        color: #032147;
      }
      main {
        width: min(680px, 92vw);
        background: #fff;
        border: 1px solid #dce3ef;
        border-radius: 16px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 10px;
        color: #4b5870;
      }
      pre {
        background: #f2f5fa;
        border-radius: 10px;
        padding: 12px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from the PM MVP Scaffold</h1>
      <p>This is a temporary static page served by FastAPI at <code>/</code>.</p>
      <p>API call result from <code>/api/hello</code>:</p>
      <pre id="result">Loading...</pre>
    </main>
    <script>
      async function loadHello() {
        const result = document.getElementById("result");
        try {
          const response = await fetch("/api/hello");
          const data = await response.json();
          result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          result.textContent = "Failed to call /api/hello";
        }
      }
      loadHello();
    </script>
  </body>
</html>
